<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>批量去水印工具</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>批量去水印工具</h1>
            <p class="subtitle">上传图片 → 框选水印 → 一键去除</p>
        </header>

        <div class="toolbar">
            <div class="toolbar-left">
                <button class="btn btn-primary" onclick="processAllImages()">✨ 批量去水印</button>
                <button class="btn btn-success" onclick="downloadAll()">📥 批量下载</button>
                <button class="btn btn-info" onclick="exportToPDF()">📄 导出PDF</button>
                <button class="btn btn-danger" onclick="clearAll()">🗑️ 清空</button>
                <div class="algorithm-select">
                    <span>算法：</span>
                    <select id="algorithmSelect">
                        <option value="telea">Telea修复 (推荐)</option>
                        <option value="ns">NS扩散修复</option>
                        <option value="gaussian">高斯模糊</option>
                        <option value="average">像素平均</option>
                    </select>
                </div>
            </div>
            <div class="toolbar-right">
                <div class="theme-buttons">
                    <div class="theme-btn" data-theme="macaron1" title="马卡龙1"></div>
                    <div class="theme-btn" data-theme="macaron2" title="马卡龙2"></div>
                    <div class="theme-btn" data-theme="macaron3" title="马卡龙3"></div>
                    <div class="theme-btn" data-theme="macaron4" title="马卡龙4"></div>
                    <div class="theme-btn" data-theme="macaron5" title="马卡龙5"></div>
                </div>
                <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">📁 导入图片</button>
                <input type="file" id="fileInput" multiple accept="image/*" hidden>
            </div>
        </div>

        <div class="tips">
            <strong>使用说明：</strong>点击"导入图片"上传需要去水印的图片，在图片上<strong>拖拽框选</strong>水印区域，然后点击"批量去水印"进行处理。支持多张图片、多个水印区域。
        </div>

        <div class="image-grid" id="imageGrid"></div>
    </div>

    <div class="modal" id="previewModal">
        <div class="modal-content">
            <span class="modal-close" onclick="closePreview()">&times;</span>
            <img id="previewImage" src="" alt="预览">
        </div>
    </div>
    <div class="toast" id="toast"></div>

    <script type="module" src="/js/app.js"></script>
</body>
</html>
